# Deletes a release and its tag: "Run workflow" with the tag (e.g. v0.42-beta). The next older release becomes the latest.
name: Delete release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the release to delete, e.g. v0.42-beta"
        required: true
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag
          gh release list -R "$GITHUB_REPOSITORY" --limit 3
