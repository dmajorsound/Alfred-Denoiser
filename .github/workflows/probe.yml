# Lists the files of some ONNX Runtime releases (to pick the download for the neural voice engine).
name: Probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in v1.19.2 v1.20.1 v1.22.0 v1.22.2 v1.23.1 v1.23.2; do
            echo "== $t"; gh release view "$t" -R microsoft/onnxruntime --json assets -q '.assets[].name' 2>&1 | grep -E "osx|win-x64-[0-9]" || echo "(none)"
          done
