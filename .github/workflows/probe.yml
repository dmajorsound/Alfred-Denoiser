# Lists the files of some ONNX Runtime releases (to pick the download for the neural voice engine).
name: Probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.23.1 -R microsoft/onnxruntime --json assets,tagName -q '.tagName, (.assets[].name)' 2>&1 | head -40 || true
          echo "== latest"; gh release list -R microsoft/onnxruntime -L 8 2>&1 || true
          echo "== direct"; curl -sI -L "https://github.com/microsoft/onnxruntime/releases/download/v1.23.1/onnxruntime-osx-universal2-1.23.1.tgz" | grep -iE "^HTTP|^location" | head -6
