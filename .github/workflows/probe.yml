# Lists the files of some ONNX Runtime releases (to pick the download for the neural voice engine).
name: Probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for v in 1.19.2 1.20.1 1.22.0 1.23.2; do
            for plat in macosx_11_0_universal2 macosx_13_0_universal2 macosx_13_0_x86_64 macosx_13_0_arm64 win_amd64; do
              rm -rf w; mkdir w
              if pip download "onnxruntime==$v" --no-deps --only-binary=:all: --platform $plat --python-version 3.12 -d w -q 2>/dev/null; then
                echo "== $v $plat: $(ls w)"; unzip -l w/*.whl | grep -iE "capi/.*(dylib|dll|\.so)" | awk '{print "   ", $1, $4}'
              else echo "== $v $plat: no wheel"; fi
            done
          done
